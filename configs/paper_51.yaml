# The 51-dataset study (paper protocol). CSV paths are relative to this file;
# put the datasets under ../data/ with the layout below (see README: Data).
output_dir: ../results/paper_51
protocol: {folds: 10, seed: 42, epochs: 30, cnn: simple, quantize: true, clip: false}
methods: [SOM2IMG, SOM2IMG_tuned, Random, IGTD, DeepInsight, CorrelationBased, REFINED, SuperTML, SnakeRandom]
baselines: [LogReg_L2, LogReg_L1_CV, RandomForest, HistGB]
datasets:
  - {name: Arcene, csv: ../data/datasets/arcene/processed.csv, target: target}
  - {name: Arrhythmia, csv: ../data/datasets/arrhythmia/processed.csv, target: target}
